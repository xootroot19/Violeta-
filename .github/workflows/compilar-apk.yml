      - name: Instalar SDK e NDK compatíveis
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'

      - name: Resolver dependências
        run: flutter pub get

      - name: Formatar e analisar
        run: |
          dart format lib test
          flutter analyze --no-fatal-infos

      - name: Testar persistência, valores, edição e navegação
        run: flutter test --reporter expanded

      - name: Compilar APK universal
        run: flutter build apk --release

      - name: Verificar e preparar APK
        run: |
          mkdir -p ../entrega
          cp build/app/outputs/flutter-apk/app-release.apk ../entrega/atelie-estudos.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ../entrega/atelie-estudos.apk
          cd ../entrega
          sha256sum atelie-estudos.apk > SHA256SUMS.txt

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Atelie-APK
          path: entrega/
          if-no-files-found: error
          retention-days: 30

      - name: Disponibilizar código Flutter reconstruído
        uses: actions/upload-artifact@v4
        with:
          name: Atelie-Codigo-Flutter
          path: |
            app/lib/
            app/assets/
            app/test/
            app/android/
            app/pubspec.yaml
            app/pubspec.lock
            app/analysis_options.yaml
            !app/android/local.properties
            !app/android/.gradle/**
          if-no-files-found: error
          retention-days: 30

      - name: Resumo da execução
        working-directory: .
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## APK pronto
          Baixe **Atelie-APK** na seção **Artifacts** desta execução.
          Extraia o ZIP e instale **atelie-estudos.apk** no Android (6.0 ou superior).

          **Hub:** escolha Nubank ou Banco do Brasil e o modo Estudo ou Realista.
          **Personalização:** toque no nome, foto ou Perfil para editar os dados de cada estudo.
          O ícone de olho oculta os valores. Os dados ficam salvos no aparelho.

          O aplicativo é um estudo de design independente, sem fins lucrativos.
          As operações são demonstrativas. O APK usa uma chave de assinatura de demonstração.
          SUMMARY
